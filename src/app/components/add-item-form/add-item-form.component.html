<div class="item-form-container">
  <div class="form-header">
    <h2>{{ title }}</h2>
    <button class="close-btn" (click)="closeForm()">×</button>
  </div>

  <form [formGroup]="itemForm" (ngSubmit)="submitForm()">
    <div class="form-group" [class.error]="isInvalid('name')">
      <label>Creator Name</label>
      <input formControlName="name" placeholder="insert your name" />
      <small *ngIf="isInvalid('name')">required</small>
    </div>

    <div class="form-group color-group">
      <label>Color</label>
      <div
        class="color-box"
        (click)="togglePicker()"
        [style.background]="colorControl?.value || '#000000'"
      ></div>
      <div class="picker-wrapper" *ngIf="showPicker">
        <color-sketch
          [color]="colorControl?.value"
          (onChange)="onColorChange($event)"
        ></color-sketch>
      </div>
    </div>

    <div class="form-group" [class.error]="isInvalid('description')">
      <label>Event</label>
      <textarea
        formControlName="description"
        placeholder="insert happy event"
      ></textarea>
      <small *ngIf="isInvalid('description')">required</small>
    </div>

    <button class="submit-btn" type="submit" [disabled]="itemForm.invalid">
      שמירה
    </button>
  </form>
</div>
